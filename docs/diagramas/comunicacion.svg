<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1094" width="1240" height="1094" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="f_ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker>
    <marker id="f_sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="f_evt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
  </defs>
  <rect width="1240" height="1094" fill="#ffffff"/>
  <text x="620" y="20" text-anchor="middle" font-size="13" fill="#607d8b">Hospital Vida Salud · Diagrama de comunicación del flujo funcional (T2)</text>
  <rect x="8" y="34" width="144" height="44" rx="7" fill="#f5f5f5" stroke="#455a64" stroke-width="1.8"/><text x="80" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#455a64">Cliente</text><text x="80" y="70" text-anchor="middle" font-size="12" fill="#455a64">Postman</text><line x1="80" y1="78" x2="80" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="162" y="34" width="144" height="44" rx="7" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="234" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f4e79">Gateway</text><text x="234" y="70" text-anchor="middle" font-size="12" fill="#1f4e79">:8080</text><line x1="234" y1="78" x2="234" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="316" y="34" width="144" height="44" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/><text x="388" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2e7d32">pacientes</text><text x="388" y="70" text-anchor="middle" font-size="12" fill="#2e7d32">:8081</text><line x1="388" y1="78" x2="388" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="470" y="34" width="144" height="44" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/><text x="542" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2e7d32">citas</text><text x="542" y="70" text-anchor="middle" font-size="12" fill="#2e7d32">:8082</text><line x1="542" y1="78" x2="542" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="624" y="34" width="144" height="44" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/><text x="696" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2e7d32">atenciones</text><text x="696" y="70" text-anchor="middle" font-size="12" fill="#2e7d32">:8083</text><line x1="696" y1="78" x2="696" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="778" y="34" width="144" height="44" rx="7" fill="#fff0e6" stroke="#e65100" stroke-width="1.8"/><text x="850" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e65100">RabbitMQ</text><text x="850" y="70" text-anchor="middle" font-size="12" fill="#e65100">HOSPITAL_INTERCAMBIO</text><line x1="850" y1="78" x2="850" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="932" y="34" width="144" height="44" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.8"/><text x="1004" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e65100">notificaciones</text><text x="1004" y="70" text-anchor="middle" font-size="12" fill="#e65100">:8084</text><line x1="1004" y1="78" x2="1004" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="1086" y="34" width="144" height="44" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.8"/><text x="1158" y="54" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e65100">auditoria</text><text x="1158" y="70" text-anchor="middle" font-size="12" fill="#e65100">:8085</text><line x1="1158" y1="78" x2="1158" y2="1078" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="14" y="97" width="1212" height="25" fill="#eceff1"/>
  <text x="24" y="113" font-size="15" font-weight="700" fill="#37474f">1. Registro de cita con validación síncrona del paciente</text>
  <line x1="80" y1="148" x2="232" y2="148" stroke="#37474f" stroke-width="1.8" marker-end="url(#f_http)"/>
  <text x="88" y="142" font-size="14" fill="#37474f" stroke="#ffffff" stroke-width="4" paint-order="stroke">POST /api/citas</text>
  <line x1="234" y1="184" x2="540" y2="184" stroke="#37474f" stroke-width="1.8" marker-end="url(#f_http)"/>
  <text x="242" y="178" font-size="14" fill="#37474f" stroke="#ffffff" stroke-width="4" paint-order="stroke">POST /citas (lb://citas)</text>
  <line x1="542" y1="220" x2="390" y2="220" stroke="#1565c0" stroke-width="1.8" marker-end="url(#f_sync)"/>
  <text x="396" y="214" font-size="14" fill="#1565c0" stroke="#ffffff" stroke-width="4" paint-order="stroke">GET /pacientes/{id} · WebClient · timeout 3 s</text>
  <line x1="388" y1="256" x2="540" y2="256" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="396" y="250" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">200 PacienteDto (estado ACTIVO)</text>
  <rect x="550" y="275" width="308.8" height="25" rx="4" fill="#fffde7" stroke="#f9a825"/>
  <text x="559" y="292" font-size="13.5" fill="#5d4037">valida agenda y guarda la cita (R2DBC)</text>
  <line x1="542" y1="328" x2="848" y2="328" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/>
  <text x="550" y="322" font-size="14" fill="#e65100" stroke="#ffffff" stroke-width="4" paint-order="stroke">CitaRegistrada</text>
  <line x1="542" y1="364" x2="82" y2="364" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="88" y="358" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">201 Cita PENDIENTE (a través del Gateway)</text>
  <rect x="14" y="393" width="1212" height="25" fill="#eceff1"/>
  <text x="24" y="409" font-size="15" font-weight="700" fill="#37474f">2. Confirmación de la cita y evento CitaConfirmada</text>
  <line x1="80" y1="444" x2="540" y2="444" stroke="#37474f" stroke-width="1.8" marker-end="url(#f_http)"/>
  <text x="88" y="438" font-size="14" fill="#37474f" stroke="#ffffff" stroke-width="4" paint-order="stroke">PUT /api/citas/1/estado {CONFIRMADA} (vía Gateway)</text>
  <rect x="550" y="463" width="415.2" height="25" rx="4" fill="#fffde7" stroke="#f9a825"/>
  <text x="559" y="480" font-size="13.5" fill="#5d4037">valida la transición PENDIENTE → CONFIRMADA y guarda</text>
  <line x1="542" y1="516" x2="848" y2="516" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/>
  <text x="550" y="510" font-size="14" fill="#e65100" stroke="#ffffff" stroke-width="4" paint-order="stroke">CitaConfirmada · routing key CITA_KEY</text>
  <line x1="542" y1="552" x2="82" y2="552" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="88" y="546" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">200 Cita CONFIRMADA</text>
  <line x1="850" y1="588" x2="1002" y2="588" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/>
  <text x="858" y="582" font-size="14" fill="#e65100" stroke="#ffffff" stroke-width="4" paint-order="stroke">NOTIFICACIONES_COLA</text>
  <rect x="1012" y="607" width="194.79999999999998" height="25" rx="4" fill="#fffde7" stroke="#f9a825"/>
  <text x="1021" y="624" font-size="13.5" fill="#5d4037">registra el aviso (log)</text>
  <line x1="850" y1="660" x2="1156" y2="660" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/>
  <text x="858" y="654" font-size="14" fill="#e65100" stroke="#ffffff" stroke-width="4" paint-order="stroke">AUDITORIA_COLA</text>
  <rect x="955.2" y="679" width="194.79999999999998" height="25" rx="4" fill="#fffde7" stroke="#f9a825"/>
  <text x="964.2" y="696" font-size="13.5" fill="#5d4037">guarda anterior → nuevo</text>
  <rect x="14" y="725" width="1212" height="25" fill="#eceff1"/>
  <text x="24" y="741" font-size="15" font-weight="700" fill="#37474f">3. Registro de la atención vinculada a la cita</text>
  <line x1="80" y1="776" x2="694" y2="776" stroke="#37474f" stroke-width="1.8" marker-end="url(#f_http)"/>
  <text x="88" y="770" font-size="14" fill="#37474f" stroke="#ffffff" stroke-width="4" paint-order="stroke">POST /api/atenciones {citaId: 1} (vía Gateway)</text>
  <line x1="696" y1="812" x2="544" y2="812" stroke="#1565c0" stroke-width="1.8" marker-end="url(#f_sync)"/>
  <text x="550" y="806" font-size="14" fill="#1565c0" stroke="#ffffff" stroke-width="4" paint-order="stroke">GET /citas/1 · ¿está CONFIRMADA?</text>
  <line x1="542" y1="848" x2="694" y2="848" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="550" y="842" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">200 CitaDto CONFIRMADA</text>
  <line x1="696" y1="884" x2="544" y2="884" stroke="#1565c0" stroke-width="1.8" marker-end="url(#f_sync)"/>
  <text x="550" y="878" font-size="14" fill="#1565c0" stroke="#ffffff" stroke-width="4" paint-order="stroke">PUT /citas/1/estado {ATENDIDA}</text>
  <line x1="542" y1="920" x2="848" y2="920" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/>
  <text x="550" y="914" font-size="14" fill="#e65100" stroke="#ffffff" stroke-width="4" paint-order="stroke">CitaAtendida (llega a notificaciones y auditoria)</text>
  <line x1="542" y1="956" x2="694" y2="956" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="550" y="950" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">200 Cita ATENDIDA</text>
  <rect x="704" y="975" width="301.2" height="25" rx="4" fill="#fffde7" stroke="#f9a825"/>
  <text x="713" y="992" font-size="13.5" fill="#5d4037">guarda la atención REGISTRADA (R2DBC)</text>
  <line x1="696" y1="1028" x2="82" y2="1028" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/>
  <text x="88" y="1022" font-size="14" fill="#78909c" stroke="#ffffff" stroke-width="4" paint-order="stroke">201 Atención REGISTRADA</text>
  <g font-size="13.5" fill="#37474f">
    <line x1="24" y1="1086" x2="56" y2="1086" stroke="#37474f" stroke-width="1.8" marker-end="url(#f_http)"/><text x="62" y="1090">HTTP</text>
    <line x1="120" y1="1086" x2="152" y2="1086" stroke="#1565c0" stroke-width="1.8" marker-end="url(#f_sync)"/><text x="158" y="1090">WebClient síncrono</text>
    <line x1="300" y1="1086" x2="332" y2="1086" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f_ret)"/><text x="338" y="1090">Respuesta</text>
    <line x1="430" y1="1086" x2="462" y2="1086" stroke="#e65100" stroke-width="1.8" stroke-dasharray="8 4" marker-end="url(#f_evt)"/><text x="468" y="1090">Evento asíncrono (CitaEventoDto en JSON)</text>
  </g>
</svg>
