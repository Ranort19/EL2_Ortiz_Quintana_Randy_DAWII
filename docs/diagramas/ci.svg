<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" width="1240" height="430" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1240" height="430" fill="#ffffff"/>
  <text x="620" y="18" text-anchor="middle" font-size="13" fill="#607d8b">Hospital Vida Salud · Integración continua con GitHub Actions (.github/workflows/ci.yml)</text>

  <g text-anchor="middle">
    <rect x="20" y="118" width="160" height="64" rx="8" fill="#f5f5f5" stroke="#455a64" stroke-width="1.8"/>
    <text x="100" y="145" font-size="14.5" font-weight="700" fill="#263238">Desarrollador</text>
    <text x="100" y="166" font-size="12" fill="#37474f">commit en una rama</text>

    <rect x="215" y="118" width="190" height="64" rx="8" fill="#f5f5f5" stroke="#455a64" stroke-width="1.8"/>
    <text x="310" y="145" font-size="14.5" font-weight="700" fill="#263238">push a main</text>
    <text x="310" y="166" font-size="12" fill="#37474f">o pull request hacia main</text>

    <rect x="440" y="118" width="180" height="64" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/>
    <text x="530" y="145" font-size="14.5" font-weight="700" fill="#1f4e79">GitHub Actions</text>
    <text x="530" y="166" font-size="12" fill="#1f4e79">detecta el evento</text>
  </g>
  <line x1="180" y1="150" x2="213" y2="150" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
  <line x1="405" y1="150" x2="438" y2="150" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
  <line x1="620" y1="150" x2="653" y2="150" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>

  <!-- Matriz -->
  <rect x="655" y="40" width="330" height="250" rx="8" fill="#f8fbff" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="820" y="64" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f4e79">Job build-test × 8 (matriz)</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="670" y="76" width="72" height="24" rx="12" fill="#1f4e79"/><text x="706" y="92" fill="#ffffff" font-weight="700">pacientes</text>
    <rect x="748" y="76" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="784" y="92" fill="#1f4e79">eureka</text>
    <rect x="826" y="76" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="862" y="92" fill="#1f4e79">gateway</text>
    <rect x="904" y="76" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="940" y="92" fill="#1f4e79">citas</text>
    <rect x="670" y="106" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="706" y="122" fill="#1f4e79">atenciones</text>
    <rect x="748" y="106" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="784" y="122" fill="#1f4e79">notificac.</text>
    <rect x="826" y="106" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="862" y="122" fill="#1f4e79">auditoria</text>
    <rect x="904" y="106" width="72" height="24" rx="12" fill="#e3f2fd" stroke="#1f4e79"/><text x="940" y="122" fill="#1f4e79">pagos</text>
  </g>
  <g font-size="12.5" fill="#263238">
    <text x="672" y="160">1. Descargar código (actions/checkout@v4)</text>
    <text x="672" y="184">2. Java 21 temurin + caché Maven (setup-java@v4)</text>
    <text x="672" y="208">3. chmod +x mvnw</text>
    <text x="672" y="232">4. ./mvnw --batch-mode verify</text>
    <text x="690" y="252" font-size="11.5" fill="#546e7a">compila y ejecuta las pruebas sin servidores externos</text>
    <text x="672" y="278" font-size="11.5" fill="#1f4e79">pacientes: PacienteControllerTest (foco del CI)</text>
  </g>

  <!-- Decision -->
  <line x1="985" y1="165" x2="1018" y2="165" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
  <polygon points="1090,120 1160,165 1090,210 1020,165" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="1090" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5d4037">¿Todo</text>
  <text x="1090" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5d4037">correcto?</text>

  <line x1="1090" y1="120" x2="1090" y2="84" stroke="#2e7d32" stroke-width="2" marker-end="url(#fv)"/>
  <text x="1098" y="108" font-size="12" font-weight="700" fill="#2e7d32">Sí</text>
  <rect x="1000" y="30" width="226" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1113" y="52" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b5e20">CI verde ✔</text>
  <text x="1113" y="71" text-anchor="middle" font-size="11.5" fill="#1b5e20">revisión y merge a main</text>

  <line x1="1090" y1="210" x2="1090" y2="246" stroke="#c62828" stroke-width="2" marker-end="url(#fr)"/>
  <text x="1098" y="232" font-size="12" font-weight="700" fill="#c62828">No</text>
  <rect x="1000" y="248" width="226" height="56" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1113" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b71c1c">CI rojo ✘</text>
  <text x="1113" y="291" text-anchor="middle" font-size="11.5" fill="#b71c1c">Maven termina con error · revisar logs</text>

  <path d="M1113,304 V350 H100 V184" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fr)"/>
  <text x="560" y="343" text-anchor="middle" font-size="12" fill="#c62828">corregir en la misma rama y volver a subir: el pull request ejecuta otra vez el CI</text>

  <g font-size="12" fill="#37474f">
    <text x="20" y="386">Ejecuciones reales en Ranort19/EL2_Ortiz_Quintana_Randy_DAWII: push a main en verde (run 38103043089) · PR #1 con fallo controlado en rojo</text>
    <text x="20" y="406">(run 38103389478, prueba RechazarDocumentoDuplicado) · corrección en verde (run 38103506117) · merge a main en verde (run 38103640315).</text>
  </g>
</svg>
