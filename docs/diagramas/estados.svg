<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 410" width="1240" height="410" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
  </defs>
  <rect width="1240" height="410" fill="#ffffff"/>
  <text x="620" y="18" text-anchor="middle" font-size="13" fill="#607d8b">Hospital Vida Salud · Estados y transiciones permitidas (T2)</text>

  <!-- Panel cita -->
  <rect x="14" y="30" width="752" height="330" rx="10" fill="none" stroke="#cfd8dc"/>
  <text x="30" y="54" font-size="15" font-weight="700" fill="#1b5e20">Cita (servicio citas)</text>

  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <circle cx="52" cy="160" r="8" fill="#37474f"/>
    <rect x="96" y="138" width="150" height="44" rx="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="171" y="165" fill="#1b5e20">PENDIENTE</text>
    <rect x="390" y="138" width="160" height="44" rx="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="470" y="165" fill="#1b5e20">CONFIRMADA</text>
    <rect x="610" y="74" width="140" height="42" rx="21" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="680" y="100" fill="#263238">ATENDIDA</text>
    <rect x="610" y="180" width="140" height="42" rx="21" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="680" y="206" fill="#263238">AUSENTE</text>
    <rect x="390" y="282" width="160" height="42" rx="21" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="470" y="308" fill="#263238">CANCELADA</text>
  </g>

  <g font-size="11.5" fill="#37474f" stroke="none">
    <line x1="61" y1="160" x2="94" y2="160" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="54" y="192">POST /citas</text>
    <text x="54" y="206" fill="#e65100">CitaRegistrada</text>

    <line x1="246" y1="160" x2="388" y2="160" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="317" y="152" text-anchor="middle">confirmar</text>
    <text x="317" y="178" text-anchor="middle" fill="#e65100">CitaConfirmada</text>

    <line x1="550" y1="150" x2="608" y2="102" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="566" y="96" text-anchor="end">atención</text>
    <text x="566" y="110" text-anchor="end">registrada</text>
    <text x="680" y="68" text-anchor="middle" fill="#e65100">CitaAtendida</text>

    <line x1="550" y1="170" x2="608" y2="196" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="566" y="214" text-anchor="end">no asistió</text>
    <text x="680" y="240" text-anchor="middle" fill="#e65100">CitaAusente</text>

    <line x1="470" y1="182" x2="470" y2="280" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="478" y="236">cancelar</text>

    <path d="M171,182 V303 H388" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="180" y="296">cancelar</text>
    <text x="388" y="342" text-anchor="end" fill="#e65100">CitaCancelada</text>

    <path d="M146,138 C146,100 196,100 196,136" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#f)"/>
    <text x="171" y="96" text-anchor="middle" fill="#1565c0">reprogramar</text>
    <path d="M445,138 C445,100 495,100 495,136" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#f)"/>
    <text x="470" y="96" text-anchor="middle" fill="#1565c0">reprogramar</text>
    <text x="317" y="122" text-anchor="middle" fill="#e65100">CitaReprogramada</text>
  </g>

  <!-- Panel atencion, paciente, pago -->
  <rect x="780" y="30" width="446" height="330" rx="10" fill="none" stroke="#cfd8dc"/>
  <text x="796" y="54" font-size="15" font-weight="700" fill="#1b5e20">Atención (servicio atenciones)</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="800" y="102" width="150" height="44" rx="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="875" y="129" fill="#1b5e20">REGISTRADA</text>
    <rect x="1060" y="68" width="150" height="42" rx="21" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="1135" y="94" fill="#263238">FINALIZADA</text>
    <rect x="1060" y="140" width="150" height="42" rx="21" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="1135" y="166" fill="#263238">ANULADA</text>
  </g>
  <g font-size="11.5" fill="#37474f">
    <line x1="950" y1="116" x2="1058" y2="92" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="1000" y="92" text-anchor="middle">finalizar</text>
    <line x1="950" y1="134" x2="1058" y2="160" stroke="#37474f" stroke-width="1.8" marker-end="url(#f)"/>
    <text x="1000" y="168" text-anchor="middle">anular</text>
  </g>

  <text x="796" y="222" font-size="15" font-weight="700" fill="#1b5e20">Paciente (servicio pacientes)</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="800" y="240" width="130" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="865" y="265" fill="#1b5e20">ACTIVO</text>
    <rect x="1070" y="240" width="140" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1140" y="265" fill="#1b5e20">INACTIVO</text>
  </g>
  <g font-size="11.5" fill="#37474f">
    <line x1="930" y1="252" x2="1068" y2="252" stroke="#37474f" stroke-width="1.6" marker-end="url(#f)"/>
    <line x1="1070" y1="270" x2="932" y2="270" stroke="#37474f" stroke-width="1.6" marker-end="url(#f)"/>
    <text x="1000" y="246" text-anchor="middle">PUT /pacientes/{id}</text>
    <text x="1000" y="290" text-anchor="middle">solo pacientes ACTIVO reciben citas</text>
  </g>

  <text x="796" y="326" font-size="15" font-weight="700" fill="#1b5e20">Pago (servicio pagos)</text>
  <text x="796" y="346" font-size="12" fill="#37474f">REGISTRADO: estado único al registrar un pago válido.</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#37474f">
    <rect x="20" y="374" width="40" height="22" rx="11" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="68" y="390">estado que admite cambios</text>
    <rect x="270" y="374" width="40" height="22" rx="11" fill="#eceff1" stroke="#37474f" stroke-width="3"/>
    <text x="318" y="390">estado final (otro cambio → 409 CONFLICT)</text>
    <text x="640" y="390" fill="#e65100">Naranja: evento publicado en RabbitMQ y registrado por auditoria.</text>
  </g>
</svg>
